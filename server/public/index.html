<!DOCTYPE html>
<html>
<head>
  <title>NIDS Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f8; color: #1f2937; }
    h1 { margin: 0 0 4px 0; }
    #status { color: #6b7280; margin-bottom: 20px; }
    #status.on { color: #1b7f73; }
    .row { display: flex; gap: 20px; align-items: flex-start; }
    .stats { display: flex; gap: 20px; }
    .stats div { background: white; padding: 20px 30px; border-radius: 8px; font-size: 18px; }
    .stats span { display: block; font-size: 36px; font-weight: bold; color: #1f4e79; }
    .chart { background: white; border-radius: 8px; padding: 10px; flex: 1; height: 150px; }
    #banner { color: white; padding: 15px; font-size: 20px; border-radius: 8px; margin-bottom: 20px; }
    .medium { background: #e08a00; }
    .high { background: #c62828; }
    .critical { background: #7b1fa2; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e5e7eb; }
    th { background: #e8edf3; }
    .pill { color: white; font-weight: bold; text-transform: capitalize; padding: 3px 12px; border-radius: 12px; font-size: 14px; }
    .pill.medium { background: #e08a00; } .pill.high { background: #c62828; } .pill.critical { background: #7b1fa2; }
    .totals { margin: 10px 0 20px 0; color: #4b5563; }
  </style>
</head>
<body>
  <h1>Network Intrusion Detection System</h1>
  <div id="status">Connecting to server...</div>
  <div id="banner" hidden></div>

  <h2>Packets per second</h2>
  <div class="row">
    <div class="stats">
      <div>TCP <span id="TCP">0</span></div>
      <div>UDP <span id="UDP">0</span></div>
      <div>ARP <span id="ARP">0</span></div>
    </div>
    <div class="chart"><canvas id="chart"></canvas></div>
  </div>

  <h2>Alerts</h2>
  <div class="totals">Port Scan: <b id="total-Port-Scan">0</b> &nbsp; SYN Flood: <b id="total-SYN-Flood">0</b> &nbsp; ARP Spoofing: <b id="total-ARP-Spoofing">0</b></div>
  <table>
    <thead><tr><th>Date</th><th>Time</th><th>Type</th><th>Severity</th><th>Source</th><th>Destination</th><th>Detail</th></tr></thead>
    <tbody id="alerts"></tbody>
  </table>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/chart.umd.js"></script>
  <script>
    const socket = io();
    const status = document.getElementById("status");
    socket.on("connect", () => { status.textContent = "Connected to server, waiting for sensor data"; status.className = "on"; });
    socket.on("disconnect", () => { status.textContent = "Server connection lost"; status.className = ""; });

    const chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: [], datasets: [{ label: "packets per second", data: [], borderColor: "#1f4e79", tension: 0.3, pointRadius: 0 }] },
      options: { animation: false, maintainAspectRatio: false, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
    });

    socket.on("stats", data => {
      for (const name in data) document.getElementById(name).textContent = data[name];
      chart.data.labels.push("");
      chart.data.datasets[0].data.push(data.TCP + data.UDP + data.ARP);
      if (chart.data.labels.length > 60) { chart.data.labels.shift(); chart.data.datasets[0].data.shift(); }
      chart.update();
    });

    const totals = {};
    function addRow(alert, top) {
      const row = document.createElement("tr");
      for (const value of [alert.date, alert.time, alert.type, alert.severity, alert.src, alert.dst, alert.detail]) {
        const cell = document.createElement("td");
        if (value === alert.severity) {
          const pill = document.createElement("span");
          pill.className = "pill " + alert.severity;
          pill.textContent = value;
          cell.appendChild(pill);
        } else {
          cell.textContent = value;
        }
        row.appendChild(cell);
      }
      const body = document.getElementById("alerts");
      top ? body.prepend(row) : body.appendChild(row);
      totals[alert.type] = (totals[alert.type] || 0) + 1;
      const box = document.getElementById("total-" + alert.type.replace(" ", "-"));
      if (box) box.textContent = totals[alert.type];
    }

    fetch("/api/alerts").then(r => r.json()).then(list => list.reverse().forEach(a => addRow(a, false)));

    socket.on("alert", alert => {
      addRow(alert, true);
      const banner = document.getElementById("banner");
      banner.textContent = "ALERT: " + alert.time + " " + alert.type + " from " + alert.src + " to " + alert.dst + " (" + alert.detail + ")";
      banner.className = alert.severity;
      banner.hidden = false;
      setTimeout(() => banner.hidden = true, 6000);
    });
  </script>
</body>
</html>
